name: Build Frontend

on:
  push:
    branches:
      - that

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: student-frontend

jobs:
  build:
    name: Build and Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --pull \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Trigger central deployment workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          gh api \
            --method POST \
            /repos/thebugger66/student-ecs-deployment/dispatches \
            -f event_type=deploy-both \
            -f "client_payload[frontend_tag]=${GITHUB_SHA}"
